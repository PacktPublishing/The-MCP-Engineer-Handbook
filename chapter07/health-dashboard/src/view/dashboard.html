<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Health Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; }
    header { display: flex; align-items: baseline; gap: 16px; }
    #summary { color: #555; }
    #cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-top: 12px; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 12px; border-left-width: 5px; }
    .card.healthy { border-left-color: #2e9e5b; }
    .card.degraded { border-left-color: #d99a1b; }
    .card.down { border-left-color: #cc3b3b; }
    .card h2 { font-size: 1rem; margin: 0 0 4px; }
    .status { margin: 0 0 8px; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; margin: 0; font-size: 0.85rem; }
    dt { color: #777; }
    dd { margin: 0; text-align: right; }
    button { padding: 6px 14px; border-radius: 6px; border: 1px solid #bbb; background: #f5f5f5; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>System Health</h1>
    <span id="summary">Waiting for data…</span>
    <button id="refresh-btn">Refresh</button>
  </header>
  <div id="cards"></div>
  <!-- BUNDLE -->
</body>
</html>
